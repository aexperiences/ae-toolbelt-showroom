<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Toolbelt OS</title>
<meta name="description" content="Every job, on a calendar you can subscribe to from your phone.">
<link rel="canonical" href="https://www.aexperiences.com/apps/toolbelt/calendar.html">
<meta property="og:title" content="Calendar · Toolbelt OS">
<meta property="og:description" content="Every job, on a calendar you can subscribe to from your phone.">
<meta property="og:image" content="https://www.aexperiences.com/Toolbelt_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<meta name="theme-color" content="#e4832b">
<link rel="stylesheet" href="toolbelt.css">
</head>
<body>
<script src="toolbelt.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Toolbelt;
  var content = S.mount({ active:"calendar.html", crumb:"Calendar" });
  content.appendChild(S.page("Calendar","Every job on the board. Subscribe once and it keeps itself current on your phone.",
    '<a class="btn" href="toolbelt.ics" download>Subscribe to the feed</a>'));
  var host=document.createElement("div"); content.appendChild(host); var off=0;
  function render(){
    host.innerHTML="";
    var start=S.addDays(new Date(S.thisWeek()+"T12:00:00"),off*7), wk=S.iso(start), dd=[];
    for(var i=0;i<7;i++) dd.push(S.iso(S.addDays(start,i)));
    host.appendChild(S.card('<div class="cardhead"><h2>Week of '+S.dayLabel(wk)+'</h2>'+
      '<div class="rowbtns"><button class="btn ghost" id="p">‹ Previous</button>'+
      '<button class="btn ghost" id="t">This week</button><button class="btn ghost" id="n">Next ›</button></div></div>'+
      '<div class="cal">'+dd.map(function(d){
        var rows=S.db().jobs.filter(function(j){return j.date===d;}).sort(function(a,b){return a.start<b.start?-1:1;});
        return '<div class="cal-day'+(d===S.iso(S.TODAY)?" today":"")+'"><div class="cal-h">'+S.dayLabel(d)+'</div>'+
          (rows.length?rows.map(function(j){ var c=S.customerById(j.customerId), open=!j.techId;
            return '<div class="cal-e'+(open?" open":"")+'" style="border-left-color:'+S.tradeColor(j.trade)+'">'+
              '<div class="ce-t mono">'+S.hhmm(j.start)+'</div><div class="ce-c">'+S.esc(c?c.name:"")+'</div>'+
              '<div class="ce-g">'+(open?"OPEN — needs a tech":S.esc(S.techName(j.techId)))+'</div></div>'; }).join(""):
            '<div class="cal-none">—</div>')+'</div>'; }).join("")+'</div>'));
    host.appendChild(S.card('<h2>Put it on your phone</h2><div class="split2">'+
      '<div><h3>iPhone / iPad</h3><ol class="steps"><li>Settings → Calendar → Accounts → Add Account → Other</li>'+
      '<li>Add Subscribed Calendar</li><li>Paste the feed address</li></ol></div>'+
      '<div><h3>Google Calendar</h3><ol class="steps"><li>Open Google Calendar on a computer</li>'+
      '<li>Other calendars → + → From URL</li><li>Paste the feed address</li></ol></div></div>'+
      '<p class="muted small">Subscribing is not downloading. A subscribed calendar refreshes itself; a downloaded file goes stale the moment dispatch changes.</p>'));
    host.querySelector("#p").addEventListener("click",function(){off--;render();});
    host.querySelector("#n").addEventListener("click",function(){off++;render();});
    host.querySelector("#t").addEventListener("click",function(){off=0;render();});
  }
  render();
})();
</script>
</body>
</html>
