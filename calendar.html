<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar · Toolbelt OS</title>
<meta name="description" content="The month on the wall — every job on its day, the week strip, and a feed that keeps the phone current.">
<link rel="canonical" href="https://www.aexperiences.com/apps/toolbelt/calendar.html">
<meta property="og:title" content="Calendar · Toolbelt OS">
<meta property="og:description" content="The month on the wall — every job on its day, plus a live feed for the phone.">
<meta property="og:image" content="https://www.aexperiences.com/Toolbelt_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<meta name="theme-color" content="#e4832b">
<link rel="stylesheet" href="toolbelt.css">
<style>
  .calhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;}
  .calhead h2{margin:0 10px 0 0;}
  .mgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .dow{font-size:11px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase;text-align:center;padding:2px 0 6px;}
  .mday{border:1px solid var(--line);border-radius:10px;background:var(--card);min-height:96px;
        padding:6px 6px 4px;cursor:pointer;display:flex;flex-direction:column;gap:3px;overflow:hidden;text-align:left;}
  .mday:hover{border-color:var(--tang-2);}
  .mday.out{opacity:.38;}
  .mday.wkend{background:var(--sunk);}
  .mday.today{outline:2px solid var(--tang);outline-offset:-2px;}
  .mday.sel{border-color:var(--tang);box-shadow:0 0 0 2px var(--tang-wash);}
  .mday .dnum{font-family:var(--mono);font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;align-items:center;}
  .mday .dnum b{color:var(--ink);}
  .chip{font-size:10.5px;line-height:1.25;border-left:3px solid var(--line-2);padding:1px 4px;border-radius:4px;
        background:var(--sunk);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .chip.open{background:var(--gold-wash);border-left-color:var(--gold);}
  .chip .t{font-family:var(--mono);color:var(--mut);margin-right:3px;}
  .more{font-size:10px;color:var(--mut);padding-left:4px;}
  .dhead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;}
  .drow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line-2);}
  .drow:first-of-type{border-top:0;}
  .dtime{font-family:var(--mono);min-width:110px;}
  .dwho{min-width:180px;flex:1;}
  .dtech{min-width:150px;font-size:13px;color:var(--ink-2);}
  .dtags{display:flex;gap:6px;flex-wrap:wrap;}
  @media (max-width:760px){
    .mday{min-height:52px;padding:4px;}
    .mday .chip,.mday .more{display:none;}
    .mday .dots{display:flex;gap:2px;flex-wrap:wrap;}
    .dot{width:7px;height:7px;border-radius:50%;}
  }
  @media (min-width:761px){ .mday .dots{display:none;} }
</style>
</head>
<body>
<script src="toolbelt.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Toolbelt;
  var content = S.mount({ active:"calendar.html", crumb:"Calendar" });
  content.appendChild(S.page("Calendar — the month on the wall",
    "Every job on its day, straight off the dispatch board. Subscribe once and the phone keeps itself current — " +
    "a subscribed calendar refreshes itself; a downloaded file goes stale the moment dispatch changes.",
    '<a class="btn btn-acc" href="toolbelt.ics">Subscribe to the feed</a>'));

  var host=document.createElement("div"); content.appendChild(host);

  var mCur = new Date(S.TODAY.getTime()); mCur.setDate(1);
  var selISO = S.iso(S.TODAY);
  var wOff = 0;

  function jobsOn(dISO){
    return S.db().jobs.filter(function(j){ return j.date===dISO; })
      .sort(function(a,b){ return S.hhmmToMin(a.start)-S.hhmmToMin(b.start); });
  }
  function hhmmShort(t){ var m=S.hhmmToMin(t), h=Math.floor(m/60), mm=m%60, ap=h>=12?"p":"a"; h=h%12||12;
    return h+(mm?":"+(mm<10?"0":"")+mm:"")+ap; }
  function monthName(d){ return ["January","February","March","April","May","June","July","August","September","October","November","December"][d.getMonth()]+" "+d.getFullYear(); }

  function render(){
    host.innerHTML="";

    /* ---------------- MONTH ---------------- */
    var first=new Date(mCur.getTime());
    var gridStart=S.addDays(first, -first.getDay());
    var todayISO=S.iso(S.TODAY);
    var m='<div class="calhead"><h2>'+monthName(mCur)+'</h2>'+
      '<button class="btn sm" data-mnav="-1">&lsaquo; Previous</button>'+
      '<button class="btn sm" data-mnav="0">This month</button>'+
      '<button class="btn sm" data-mnav="1">Next &rsaquo;</button></div>';
    m+='<div class="mgrid">'+["SUN","MON","TUE","WED","THU","FRI","SAT"].map(function(d){return '<div class="dow">'+d+'</div>';}).join("");
    for(var i=0;i<42;i++){
      var d=S.addDays(gridStart,i), dISO=S.iso(d);
      if(i===35 && d.getMonth()!==mCur.getMonth()) break;
      var js=jobsOn(dISO);
      var cls="mday"+(d.getMonth()!==mCur.getMonth()?" out":"")+((d.getDay()===0||d.getDay()===6)?" wkend":"")+
        (dISO===todayISO?" today":"")+(dISO===selISO?" sel":"");
      m+='<button class="'+cls+'" data-day="'+dISO+'"><span class="dnum"><b>'+d.getDate()+'</b>'+
        (js.length?'<span class="muted small">'+js.length+'</span>':'')+'</span>';
      m+='<span class="dots">'+js.slice(0,8).map(function(j){
        return '<span class="dot" style="background:'+S.tradeColor(j.trade)+'"></span>';}).join("")+'</span>';
      js.slice(0,3).forEach(function(j){
        var c=S.customerById(j.customerId);
        m+='<span class="chip'+(j.techId?'':' open')+'" style="border-left-color:'+S.tradeColor(j.trade)+'">'+
          '<span class="t">'+hhmmShort(j.start)+'</span>'+S.esc(c?c.name:"")+'</span>';
      });
      if(js.length>3) m+='<span class="more">+'+(js.length-3)+' more</span>';
      m+='</button>';
    }
    m+='</div>';
    host.appendChild(S.card(m));

    /* ---------------- SELECTED DAY ---------------- */
    var js=jobsOn(selISO);
    var hrs=js.reduce(function(a,j){return a+(j.hours||0);},0);
    var d='<div class="dhead"><h2>'+S.dayLabel(selISO)+'</h2>'+
      '<span class="muted">'+(js.length? js.length+' job'+(js.length>1?'s':'')+' · '+hrs.toFixed(1)+' hrs booked':'nothing on the board')+'</span></div>';
    js.forEach(function(j){
      var c=S.customerById(j.customerId);
      d+='<div class="drow">'+
        '<div class="dtime">'+hhmmShort(j.start)+'&ndash;'+hhmmShort(j.end)+'</div>'+
        '<div class="dwho"><b>'+S.esc(c?c.name:"")+'</b><div class="muted small">'+S.esc(j.task||j.type)+'</div></div>'+
        '<div class="dtech">'+(j.techId? S.esc(S.techName(j.techId)) : S.tag("OPEN — needs a tech","bad"))+'</div>'+
        '<div class="dtags">'+S.tag(j.trade,"") .replace('class="tag"','class="tag" style="border-color:'+S.tradeColor(j.trade)+'"')+
          S.tag(j.status, j.status==="Closed"?"good":(j.status==="OPEN"||j.status==="Missed")?"bad":j.status==="On site"?"watch":"")+'</div>'+
        '</div>';
    });
    host.appendChild(S.card(d));

    /* ---------------- WEEK STRIP ---------------- */
    var wkStartISO=S.weekOf(S.iso(S.addDays(S.TODAY, wOff*7)));
    var wkStart=new Date(wkStartISO+"T12:00:00");
    var wk=[]; for(var wi=0;wi<7;wi++) wk.push(S.addDays(wkStart,wi));
    var w='<div class="calhead"><h2>Week of '+S.dayLabel(S.iso(wk[0])).replace(/^\w+ /,"")+'</h2>'+
      '<button class="btn sm" data-wnav="-1">&lsaquo; Previous</button>'+
      '<button class="btn sm" data-wnav="0">This week</button>'+
      '<button class="btn sm" data-wnav="1">Next &rsaquo;</button></div>';
    w+='<div class="mgrid">';
    wk.forEach(function(day){
      var dISO=S.iso(day), djs=jobsOn(dISO);
      w+='<div><div class="dow">'+S.dayLabel(S.iso(day))+'</div>';
      if(!djs.length) w+='<p class="muted small">&mdash;</p>';
      djs.forEach(function(j){
        var c=S.customerById(j.customerId);
        w+='<div class="chip'+(j.techId?'':' open')+'" style="border-left-color:'+S.tradeColor(j.trade)+';margin-bottom:4px;white-space:normal;">'+
          '<span class="t">'+hhmmShort(j.start)+'</span><b>'+S.esc(c?c.name:"")+'</b><br>'+
          '<span class="muted">'+(j.techId? S.esc(S.techName(j.techId)) : "OPEN — needs a tech")+'</span></div>';
      });
      w+='</div>';
    });
    w+='</div>';
    host.appendChild(S.card(w));

    /* ---------------- PHONE FEED ---------------- */
    host.appendChild(S.card('<h2>Put it on your phone</h2>'+
      '<div class="cols2"><div><h3 class="small" style="letter-spacing:.06em;">IPHONE / IPAD</h3><ol class="small muted">'+
      '<li>Settings &rarr; Calendar &rarr; Accounts &rarr; Add Account &rarr; Other</li>'+
      '<li>Add Subscribed Calendar</li><li>Paste the feed address</li></ol></div>'+
      '<div><h3 class="small" style="letter-spacing:.06em;">GOOGLE CALENDAR</h3><ol class="small muted">'+
      '<li>Open Google Calendar on a computer</li><li>Other calendars &rarr; + &rarr; From URL</li>'+
      '<li>Paste the feed address</li></ol></div></div>'+
      '<p class="sub muted small">Subscribing is not downloading. A subscribed calendar refreshes itself; a downloaded file goes stale the moment dispatch changes.</p>'));

    host.querySelectorAll("[data-day]").forEach(function(b){ b.onclick=function(){ selISO=b.dataset.day; render(); }; });
    host.querySelectorAll("[data-mnav]").forEach(function(b){ b.onclick=function(){
      var n=+b.dataset.mnav;
      if(n===0){ mCur=new Date(S.TODAY.getTime()); mCur.setDate(1); }
      else mCur.setMonth(mCur.getMonth()+n);
      render(); }; });
    host.querySelectorAll("[data-wnav]").forEach(function(b){ b.onclick=function(){
      var n=+b.dataset.wnav; wOff = n===0?0:wOff+n; render(); }; });
  }
  render();
})();
</script>
</body>
</html>
