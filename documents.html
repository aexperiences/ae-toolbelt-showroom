.dc-bar button:hover{background:#fff;border-color:var(--line)}
.dc-bar .sep{width:1px;height:20px;background:var(--line);margin:0 3px}
.dc-page{border:1px solid var(--line);border-radius:0 0 12px 12px;background:#fff;padding:34px 40px;min-height:420px;font-size:15px;line-height:1.72;outline:none}

/* ============================================================ zip, for real
   A .docx and a .xlsx are ZIP files full of XML. We build the zip here, in the
   browser, with the STORED method — no compression, no library, and Word and
   Excel both open it. Nothing is faked and nothing leaves the machine.       */
var CRCT=(function(){var t=new Int32Array(256);for(var n=0;n<256;n++){var c=n;
  for(var k=0;k<8;k++)c=c&1?(0xEDB88320^(c>>>1)):(c>>>1);t[n]=c;}return t;})();
function crc32(u8){var c=-1;for(var i=0;i<u8.length;i++)c=CRCT[(c^u8[i])&0xFF]^(c>>>8);return (c^-1)>>>0;}
function utf8(s){return new TextEncoder().encode(s);}
function zip(files){
  var parts=[],central=[],off=0;
  function u16(n){return [n&255,(n>>8)&255];}
  function u32(n){return [n&255,(n>>8)&255,(n>>16)&255,(n>>24)&255];}
  files.forEach(function(f){
    var name=utf8(f.name), data=utf8(f.data), crc=crc32(data);
    var h=[].concat(u32(0x04034b50),u16(20),u16(0),u16(0),u16(0),u16(0),
                    u32(crc),u32(data.length),u32(data.length),u16(name.length),u16(0));
    parts.push(new Uint8Array(h),name,data);
    central.push({name:name,crc:crc,len:data.length,off:off});
    off+=h.length+name.length+data.length;
  });
  var cd=[],cdLen=0;
  central.forEach(function(e){
    var h=[].concat(u32(0x02014b50),u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
                    u32(e.crc),u32(e.len),u32(e.len),u16(e.name.length),
                    u16(0),u16(0),u16(0),u16(0),u32(0),u32(e.off));
    cd.push(new Uint8Array(h),e.name); cdLen+=h.length+e.name.length;
  });
  var end=new Uint8Array([].concat(u32(0x06054b50),u16(0),u16(0),
            u16(central.length),u16(central.length),u32(cdLen),u32(off),u16(0)));
  var all=parts.concat(cd,[end]), total=0;
  all.forEach(function(p){total+=p.length;});
  var out=new Uint8Array(total),p=0;
  all.forEach(function(a){out.set(a,p);p+=a.length;});
  return out;
}
function download(bytes,name,mime){
  var b=new Blob([bytes],{type:mime}), u=URL.createObjectURL(b);
  var a=document.createElement("a"); a.href=u; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){URL.revokeObjectURL(u);},2000);
}
function xe(s){return String(s==null?"":s).replace(/[&<>"']/g,function(ch){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&apos;"}[ch];});}

/* ---------------------------------------------------------------- word ---- */
function runXml(text,b,i,u){
  if(!text) return "";
  var pr="";
  if(b||i||u){ pr="<w:rPr>"+(b?"<w:b/>":"")+(i?"<w:i/>":"")+(u?'<w:u w:val="single"/>':"")+"</w:rPr>"; }
  return "<w:r>"+pr+'<w:t xml:space="preserve">'+xe(text)+"</w:t></w:r>";
}
function nodeRuns(node,b,i,u){
  var out="";
  Array.prototype.forEach.call(node.childNodes,function(n){
    if(n.nodeType===3){ out+=runXml(n.nodeValue,b,i,u); return; }
    if(n.nodeType!==1) return;
    var t=n.tagName.toLowerCase();
    out+=nodeRuns(n, b||t==="b"||t==="strong", i||t==="i"||t==="em", u||t==="u");
  });
  return out;
}
function para(runs,style,bullet){
  var pr="<w:pPr>";
  if(style) pr+='<w:pStyle w:val="'+style+'"/>';
  if(bullet) pr+='<w:numPr><w:ilvl w:val="0"/><w:numId w:val="1"/></w:numPr>';
  pr+="</w:pPr>";
  return "<w:p>"+pr+(runs||"")+"</w:p>";
}
function htmlToDocxBody(root){
  var body="";
  Array.prototype.forEach.call(root.children,function(n){
    var t=n.tagName.toLowerCase();
    if(t==="h1"){ body+=para(nodeRuns(n,1,0,0),"Heading1"); }
    else if(t==="h2"){ body+=para(nodeRuns(n,1,0,0),"Heading2"); }
    else if(t==="ul"||t==="ol"){
      Array.prototype.forEach.call(n.children,function(li){ body+=para(nodeRuns(li,0,0,0),null,true); });
    }
    else { body+=para(nodeRuns(n,0,0,0)); }
  });
  if(!body) body=para("");
  return body;
}
function makeDocx(title,root){
  var body=htmlToDocxBody(root);
  var doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    "<w:body>"+body+
    '<w:sectPr><w:pgSz w:w="12240" w:h="15840"/>'+
    '<w:pgMar w:top="1440" w:right="1440" w:bottom="1440" w:left="1440"/></w:sectPr>'+
    "</w:body></w:document>";
  var styles='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:style w:type="paragraph" w:styleId="Heading1"><w:name w:val="heading 1"/>'+
    '<w:pPr><w:outlineLvl w:val="0"/><w:spacing w:before="240" w:after="120"/></w:pPr>'+
    '<w:rPr><w:b/><w:sz w:val="36"/></w:rPr></w:style>'+
    '<w:style w:type="paragraph" w:styleId="Heading2"><w:name w:val="heading 2"/>'+
    '<w:pPr><w:outlineLvl w:val="1"/><w:spacing w:before="200" w:after="100"/></w:pPr>'+
    '<w:rPr><w:b/><w:sz w:val="28"/></w:rPr></w:style></w:styles>';
  var numbering='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:numbering xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:abstractNum w:abstractNumId="0"><w:lvl w:ilvl="0"><w:numFmt w:val="bullet"/>'+
    '<w:lvlText w:val="&#8226;"/><w:pPr><w:ind w:left="720" w:hanging="360"/></w:pPr></w:lvl></w:abstractNum>'+
    '<w:num w:numId="1"><w:abstractNumId w:val="0"/></w:num></w:numbering>';
  return zip([
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'+
      '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'+
      '<Override PartName="/word/numbering.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.numbering+xml"/>'+
      "</Types>"},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'+
      "</Relationships>"},
    {name:"word/_rels/document.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/numbering" Target="numbering.xml"/>'+
      "</Relationships>"},
    {name:"word/document.xml",data:doc},
    {name:"word/styles.xml",data:styles},
    {name:"word/numbering.xml",data:numbering}
  ]);
}

/* --------------------------------------------------------------- excel ---- */
function colName(n){var s="";n++;while(n>0){var m=(n-1)%26;s=String.fromCharCode(65+m)+s;n=(n-m-1)/26;}return s;}
function makeXlsx(rows){
  var sd="";
  rows.forEach(function(r,ri){
    var cells="";
    r.forEach(function(v,ci){
      if(v===""||v==null) return;
      var ref=colName(ci)+(ri+1);
      if(/^-?\d+(\.\d+)?$/.test(String(v))) cells+='<c r="'+ref+'"><v>'+v+"</v></c>";
      else cells+='<c r="'+ref+'" t="inlineStr"><is><t xml:space="preserve">'+xe(v)+"</t></is></c>";
    });
    sd+='<row r="'+(ri+1)+'">'+cells+"</row>";
  });
  var sheet='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    "<sheetData>"+sd+"</sheetData></worksheet>";
  return zip([
    {name:"[Content_Types].xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'+
      "</Types>"},
    {name:"_rels/.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      "</Relationships>"},
    {name:"xl/workbook.xml",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" '+
      'xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets><sheet name="Sheet1" sheetId="1" r:id="rId1"/></sheets></workbook>'},
    {name:"xl/_rels/workbook.xml.rels",data:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'+
      "</Relationships>"},
    {name:"xl/worksheets/sheet1.xml",data:sheet}
  ]);
}

function load(){ try{var v=JSON.parse(sessionStorage.getItem(KEY)); if(v&&v.length) return v;}catch(e){} return SEEDDOCS.slice(); }
function persist(){ try{ sessionStorage.setItem(KEY,JSON.stringify(DOCS)); }catch(e){} }
var DOCS=load(), CUR=DOCS[0]||null;

function fileToRecords(doc){
  var list=[];
  try{ list=JSON.parse(sessionStorage.getItem(RKEY))||[]; }catch(e){}
  if(!list.length){ list=[]; }
  list.unshift({cab:doc.cab||"contracts",name:doc.name,kind:doc.kind==="sheet"?"xls":"doc",
                tag:"fin",who:doc.who||owner,when:doc.when||today(),note:"Written in Documents"});
  try{ sessionStorage.setItem(RKEY,JSON.stringify(list)); }catch(e){}
  doc.filed=true; persist();
}

function paintList(){
  leftBox.innerHTML="";
  var box=document.createElement("div"); box.className="dc-list";
  DOCS.forEach(function(doc){
    var r=T.el('<div class="dc-row'+(CUR&&CUR.id===doc.id?" on":"")+'">'+
      '<div class="dc-ic">'+(doc.kind==="sheet"?"&#128202;":"&#128196;")+'</div>'+
      '<div><div class="dc-nm">'+esc(doc.name)+'</div>'+
      '<div class="dc-mt">'+esc(doc.when||"")+(doc.filed?" · filed":" · draft")+'</div></div></div>');
    r.onclick=function(){ CUR=doc; paint(); };
    box.appendChild(r);
  });
  var nb=T.el('<button class="dc-new">+ New blank document</button>');
  nb.onclick=function(){ newDoc({kind:"doc",cab:"contracts",title:"Untitled ",body:"<h1>Untitled</h1><p></p>"}); };
  box.appendChild(nb);
  leftBox.appendChild(T.card('<h2>Documents</h2><p class="sub">'+DOCS.length+
    ' in the book &middot; '+DOCS.filter(function(x){return x.filed;}).length+' filed</p>'));
  leftBox.appendChild(box);
}

function newDoc(tpl){
  var doc={id:"d"+Date.now(),kind:tpl.kind,cab:tpl.cab,name:(tpl.title||"Untitled ")+today(),
           when:today(),who:owner,filed:false};
  if(tpl.kind==="sheet") doc.rows=JSON.parse(JSON.stringify(tpl.rows));
  else doc.body=tpl.body;
  DOCS.unshift(doc); CUR=doc; persist(); paint();
  T.toast("New document started.","ok");
}

function paintEditor(){
  rightBox.innerHTML="";
  var tplRow=document.createElement("div"); tplRow.className="dc-tpl";
  TEMPLATES.forEach(function(t){
    var b=T.el("<button>"+esc(t.label)+"</button>");
    b.onclick=function(){ newDoc(t); };
    tplRow.appendChild(b);
  });
  var wrap=document.createElement("div");
  wrap.appendChild(T.el('<h2 style="margin:0 0 4px">Start from a template</h2>'+
    '<p class="sub" style="margin:0 0 10px">Every one of these is a page a shop actually keeps.</p>'));
  wrap.appendChild(tplRow);
  rightBox.appendChild(T.card(""));
  rightBox.lastChild.appendChild(wrap);

  if(!CUR){ rightBox.appendChild(T.card('<p class="muted">Pick a document on the left, or start one above.</p>')); return; }

  var ed=document.createElement("div");
  var title=T.el('<input class="dc-title" value="'+esc(CUR.name)+'">');
  title.oninput=function(){ CUR.name=title.value; persist(); paintList(); };
  ed.appendChild(title);

  var page;
  if(CUR.kind==="sheet"){
    var tbl=document.createElement("table"); tbl.className="dc-sheet";
    var head=document.createElement("tr");
    (CUR.rows[0]||[]).forEach(function(h){ head.appendChild(T.el("<th>"+esc(h)+"</th>")); });
    tbl.appendChild(head);
    CUR.rows.slice(1).forEach(function(row,ri){
      var tr=document.createElement("tr");
      row.forEach(function(v,ci){
        var td=document.createElement("td");
        var inp=T.el('<input value="'+esc(v)+'">');
        inp.oninput=function(){ CUR.rows[ri+1][ci]=inp.value; persist(); };
        td.appendChild(inp); tr.appendChild(td);
      });
      tbl.appendChild(tr);
    });
    var sw=document.createElement("div");
    sw.style.cssText="border:1px solid var(--line);border-radius:12px;overflow:auto";
    sw.appendChild(tbl); ed.appendChild(sw);
    var addr=T.el('<button class="dc-new" style="border-radius:0 0 12px 12px">+ Add a row</button>');
    addr.onclick=function(){ CUR.rows.push(CUR.rows[0].map(function(){return "";})); persist(); paint(); };
    sw.appendChild(addr);
  } else {
    var bar=document.createElement("div"); bar.className="dc-bar";
    [["B","bold","<b>B</b>"],["I","italic","<i>I</i>"],["U","underline","<u>U</u>"],
     ["SEP","",""],
     ["H1","formatBlock:h1","H1"],["H2","formatBlock:h2","H2"],["P","formatBlock:p","&para;"],
     ["SEP","",""],
     ["UL","insertUnorderedList","&bull; List"],["OL","insertOrderedList","1. List"]
    ].forEach(function(x){
      if(x[0]==="SEP"){ bar.appendChild(T.el('<span class="sep"></span>')); return; }
      var b=T.el("<button>"+x[2]+"</button>");
      b.onmousedown=function(e){ e.preventDefault(); };
      b.onclick=function(){
        var cmd=x[1];
        if(cmd.indexOf("formatBlock:")===0) document.execCommand("formatBlock",false,cmd.split(":")[1]);
        else document.execCommand(cmd,false,null);
        page.focus(); CUR.body=page.innerHTML; persist();
      };
      bar.appendChild(b);
    });
    ed.appendChild(bar);
    page=T.el('<div class="dc-page" contenteditable="true"></div>');
    page.innerHTML=CUR.body||"<p></p>";
    page.oninput=function(){ CUR.body=page.innerHTML; persist(); };
    ed.appendChild(page);
  }

  var acts=document.createElement("div"); acts.className="dc-acts";
  var save=T.el('<button class="pri">Save</button>');
  save.onclick=function(){ persist(); T.toast("Saved.","ok"); paintList(); };
  acts.appendChild(save);

  if(CUR.kind==="sheet"){
    var xb=T.el("<button>Download .xlsx</button>");
    xb.onclick=function(){
      download(makeXlsx(CUR.rows), safeName(CUR.name)+".xlsx",
        "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet");
      T.toast("Excel file downloaded.","ok");
    };
    acts.appendChild(xb);
    var cb=T.el("<button>Download .csv</button>");
    cb.onclick=function(){
      var csv=CUR.rows.map(function(r){return r.map(function(v){
        return /[",\n]/.test(v)?'"'+String(v).replace(/"/g,'""')+'"':v; }).join(","); }).join("\n");
      download(utf8(csv), safeName(CUR.name)+".csv","text/csv");
      T.toast("CSV downloaded.","ok");
    };
    acts.appendChild(cb);
  } else {
    var wb=T.el("<button>Download .docx</button>");
    wb.onclick=function(){
      download(makeDocx(CUR.name,page), safeName(CUR.name)+".docx",
        "application/vnd.openxmlformats-officedocument.wordprocessingml.document");
      T.toast("Word file downloaded.","ok");
    };
    acts.appendChild(wb);
    var pb=T.el("<button>Print / PDF</button>");
    pb.onclick=function(){
      var w=window.open("","_blank");
      w.document.write('<title>'+esc(CUR.name)+'</title><style>body{font:15px/1.7 Georgia,serif;'+
        'max-width:44em;margin:48px auto;padding:0 24px}h1{font-size:26px}h2{font-size:19px}</style>'+
        page.innerHTML);
      w.document.close(); w.focus(); setTimeout(function(){w.print();},250);
    };
    acts.appendChild(pb);
  }

  var fb=T.el("<button>"+(CUR.filed?"Filed in Records &#10003;":"File it in Records")+"</button>");
  fb.onclick=function(){
    fileToRecords(CUR);
    T.toast("Filed under "+CUR.cab+" in Records.","ok");
    paint();
  };
  acts.appendChild(fb);
  ed.appendChild(acts);

  ed.appendChild(T.el('<div class="dc-note">The .docx and .xlsx are built here in the browser and open in '+
    'Word, Excel, Pages, Numbers, Google Docs and LibreOffice. Nothing is uploaded to write them. '+
    'Filing puts the finished page in the Records cabinet under <b>'+esc(CUR.cab)+'</b> — the same cabinet '+
    'an inspector or an accountant would ask for it from.</div>'));

  rightBox.appendChild(T.card(""));
  rightBox.lastChild.appendChild(ed);
}

function safeName(s){ return String(s).replace(/[^\w\- ]+/g,"").replace(/\s+/g," ").trim().slice(0,80)||"document"; }
function paint(){ paintList(); paintEditor(); }
paint();
})();
</script>
</body>
</html>
