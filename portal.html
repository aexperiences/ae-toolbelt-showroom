<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Customer Portal · Toolbelt OS</title>
<meta name="description" content="Where the tech is, what was done, what it cost and the photos — without a phone call to the office.">
<link rel="canonical" href="https://www.aexperiences.com/apps/toolbelt/portal.html">
<meta property="og:title" content="Customer Portal · Toolbelt OS">
<meta property="og:description" content="Where the tech is, what was done, what it cost and the photos — without a phone call to the office.">
<meta property="og:image" content="https://www.aexperiences.com/Toolbelt_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<meta name="theme-color" content="#e4832b">
<link rel="stylesheet" href="toolbelt.css">
</head>
<body>
<script src="toolbelt.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Toolbelt;
  var content = S.mount({ active:"portal.html", crumb:"Customer Portal" });
  content.appendChild(S.page("Customer portal",
    "Most calls to a service office are one of three questions: is someone coming, what did you do, and what do I owe. This answers all three.",""));
  var host=document.createElement("div"); content.appendChild(host);
  var sel=S.db().customers[0]?S.db().customers[0].id:null;
  function render(){
    host.innerHTML="";
    host.appendChild(S.card('<h2>Preview the portal</h2><label class="fld inline"><span>As</span><select id="pick">'+
      S.db().customers.map(function(c){return '<option value="'+c.id+'"'+(c.id===sel?" selected":"")+'>'+S.esc(c.name)+'</option>';}).join("")+
      '</select></label>'));
    var c=S.customerById(sel); if(!c) return wire();
    var past=S.db().jobs.filter(function(j){return j.customerId===c.id&&(j.status==="Closed"||j.status==="On site");})
      .sort(function(a,b){return a.date<b.date?1:-1;}).slice(0,8);
    var next=S.db().jobs.filter(function(j){return j.customerId===c.id&&j.status==="Scheduled";})
      .sort(function(a,b){return a.date<b.date?-1:1;}).slice(0,5);
    host.appendChild(S.card('<div class="portal"><div class="cardhead"><h2>'+S.esc(c.name)+'</h2>'+
      '<span class="tag">'+S.esc(c.kind)+'</span>'+(c.agreement&&c.agreement!=="none"?S.tag(c.agreement,"good"):"")+'</div>'+
      '<p class="sub">What the customer sees. No internal codes, no tech pay rates, no margin.</p>'+
      '<table class="kv"><tbody><tr><th>Service address</th><td>'+S.esc(c.addr)+', '+S.esc(c.city)+'</td></tr>'+
      '<tr><th>Equipment on file</th><td>'+S.esc(c.equip)+'</td></tr>'+
      (c.agreementAnnual?'<tr><th>Agreement</th><td>'+S.esc(c.agreement)+' · '+S.money(c.agreementAnnual)+'/yr</td></tr>':'')+
      '</tbody></table>'+
      '<h3 style="margin-top:20px">Coming up</h3><div class="tablewrap"><table><tbody>'+
      (next.length?next.map(function(j){ return '<tr><td class="mono">'+S.dayLabel(j.date)+'</td>'+
        '<td class="mono">'+S.hhmm(j.start)+'</td><td>'+S.esc(j.task)+'</td>'+
        '<td>'+S.esc(S.techName(j.techId))+'</td></tr>'; }).join(""):'<tr><td class="muted">Nothing scheduled.</td></tr>')+
      '</tbody></table></div>'+
      '<h3 style="margin-top:20px">Work history</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Tech</th>'+
      '<th>What was done</th><th class="right">Invoice</th></tr></thead><tbody>'+
      (past.length?past.map(function(j){ var r=S.rateFor(j);
        return '<tr><td class="mono">'+S.dayLabel(j.date)+'</td><td>'+S.esc(S.techName(j.techId))+'</td>'+
          '<td>'+S.esc((j.proof&&j.proof.tasks&&j.proof.tasks.length)?j.proof.tasks.join(" · "):j.task)+
            '<div class="muted small">'+j.photos+' photo(s)</div></td>'+
          '<td class="right mono">'+(j.status==="On site"?'<i class="muted">in progress</i>':
            S.isWarrantyWork(j.billing)?'<span class="muted">no charge — warranty</span>':S.money2(r.revenue))+'</td></tr>';
        }).join(""):'<tr><td colspan="4" class="muted">No history yet.</td></tr>')+
      '</tbody></table></div>'+
      '<p class="muted small" style="margin-top:12px">Warranty work shows as no charge rather than being hidden — the customer '+
      'seeing that you came back for free, and that it cost them nothing, is the whole point of doing it.</p></div>'));
    wire();
  }
  function wire(){ var p=host.querySelector("#pick"); if(p) p.addEventListener("change",function(){ sel=p.value; render(); }); }
  render();
})();
</script>
</body>
</html>
