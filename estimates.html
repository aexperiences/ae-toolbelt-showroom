<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estimates · Toolbelt OS</title>
<meta name="description" content="Requested to won, with the margin on the quote before you send it.">
<link rel="canonical" href="https://www.aexperiences.com/apps/toolbelt/estimates.html">
<meta property="og:title" content="Estimates · Toolbelt OS">
<meta property="og:description" content="Requested to won, with the margin on the quote before you send it.">
<meta property="og:image" content="https://www.aexperiences.com/Toolbelt_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<meta name="theme-color" content="#e4832b">
<link rel="stylesheet" href="toolbelt.css">
</head>
<body>
<script src="toolbelt.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Toolbelt;
  var content = S.mount({ active:"estimates.html", crumb:"Estimates" });
  content.appendChild(S.page("Estimates","Requested → quoted → won. The margin is on the quote before it goes out, not discovered afterwards.",
    '<button class="btn" id="add">+ New estimate</button>'));
  var aiHost=document.createElement("div"); content.appendChild(aiHost);
  var host=document.createElement("div"); content.appendChild(host);

  /* AI DRAFT — describe the job, get a scope, parts from this shop's list, and labor hours.
     Every dollar below is worked out from the shop's own costs, markup and labor rate. */
  var qm=new URLSearchParams(location.search).get("measure"), fromM=null;
  if(qm) fromM=S.measures().filter(function(m){ return m.id===qm; })[0]||null;
  var lastDraft=null;
  function mText(m){ return m ? (m.kind==="area" ? m.label+": "+Math.round(m.surfaceSqft)+" sq ft"+(m.pitch!=="Flat"?" of roof at "+m.pitch+" pitch":"")+", "+Math.round(m.lengthFt)+" ft around the edge"
    : m.label+": "+Math.round(m.lengthFt)+" linear ft") : ""; }
  function renderAi(){
    var cs=S.db().customers, trades=S.modeTrades();
    aiHost.innerHTML="";
    aiHost.appendChild(S.card('<h2>Draft it with AI</h2>'+
      '<p class="sub">Say what the job is in plain words. You get the work steps, parts from your own parts list, and labor hours. Prices come from your own costs and rates, never from the AI.</p>'+
      '<div class="tc-form" style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        '<div class="fld"><label for="aiCust">Customer</label><select id="aiCust">'+cs.map(function(c){ return '<option value="'+S.esc(c.id)+'"'+(fromM&&fromM.customerId===c.id?' selected':'')+'>'+S.esc(c.name)+'</option>'; }).join("")+'</select></div>'+
        '<div class="fld"><label for="aiTrade">Kind of work</label><select id="aiTrade">'+trades.map(function(t){ return '<option>'+S.esc(t)+'</option>'; }).join("")+'</select></div>'+
        '<div class="fld" style="grid-column:1/-1"><label for="aiText">The job</label><textarea id="aiText" rows="3" maxlength="1500" placeholder="No heat. 2014 furnace, igniter clicks but no flame. Customer wants a quote to replace the thermostat too.">'+S.esc(fromM?"Measured: "+mText(fromM)+". ":"")+'</textarea></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn tang" id="aiGo">Draft it</button>'+
        '<a class="btn ghost" href="measure.html">Measure first</a></div>'+
      '<div id="aiOut"></div>'));
    var go=aiHost.querySelector("#aiGo");
    go.onclick=function(){ var t=aiHost.querySelector("#aiText").value.trim(); if(t.length<8) return S.toast("Say a little more about the job.","bad");
      go.disabled=true; go.textContent="Drafting…";
      S.aiDraftEstimate(t, aiHost.querySelector("#aiTrade").value, fromM?mText(fromM):"").then(function(r){
        go.disabled=false; go.textContent="Draft it";
        if(!r.ok) return S.toast(r.why,"bad");
        lastDraft={ r:r, text:t, cust:aiHost.querySelector("#aiCust").value, trade:aiHost.querySelector("#aiTrade").value }; showDraft(); }); };
  }
  function showDraft(){
    var r=lastDraft.r, d=r.draft, p=r.priced, office=S.seesMoney(), out=aiHost.querySelector("#aiOut");
    var m=p.price?((p.price-p.cost)/p.price)*100:0;
    out.innerHTML='<div class="note" style="margin-top:14px">'+
      '<b>Work</b><ol style="margin:6px 0 10px 18px;padding:0">'+d.scope.map(function(x){ return '<li>'+S.esc(x)+'</li>'; }).join("")+'</ol>'+
      '<b>Parts</b>'+(p.lines.length?'<ul style="margin:6px 0 10px 18px;padding:0">'+p.lines.map(function(l){ return '<li>'+l.qty+' × '+S.esc(l.name)+' <span class="muted small">'+S.esc(l.sku)+'</span>'+(office?' <span class="mono small">'+S.money2(l.price)+'</span>':'')+'</li>'; }).join("")+'</ul>':'<p class="muted small">None from your list.</p>')+
      '<b>Labor</b> <span class="mono">'+p.hours+' hours</span>'+(office?' <span class="mono small">'+S.money2(p.laborPrice)+'</span>':'')+
      (d.questions.length?'<div style="margin-top:10px"><b>Confirm on site</b><ul style="margin:6px 0 0 18px;padding:0">'+d.questions.map(function(x){ return '<li>'+S.esc(x)+'</li>'; }).join("")+'</ul></div>':'')+
      (office?'<table class="kv" style="margin-top:12px"><tbody><tr><th>Suggested price</th><td class="mono"><b>'+S.money2(p.price)+'</b></td></tr><tr><th>Your cost</th><td class="mono">'+S.money2(p.cost)+'</td></tr><tr><th>Margin</th><td class="mono">'+S.pct(m,1)+'</td></tr></tbody></table>':'')+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px"><button class="btn tang" id="aiSave">Save as an estimate</button><button class="btn ghost" id="aiAgain">Draft again</button></div>'+
      '<div class="muted small" style="margin-top:8px">A draft from AI. Check it before it goes to the customer.</div></div>';
    out.querySelector("#aiAgain").onclick=function(){ aiHost.querySelector("#aiGo").click(); };
    out.querySelector("#aiSave").onclick=function(){
      var note=lastDraft.text+"\n\nWork: "+d.scope.join("; ")+(p.lines.length?"\nParts: "+p.lines.map(function(l){ return l.qty+" × "+l.name; }).join("; "):"")+"\nLabor: "+p.hours+" hours"+(d.questions.length?"\nConfirm: "+d.questions.join("; "):"");
      S.addEstimate({ customerId:lastDraft.cust, title:(d.scope[0]||lastDraft.text).slice(0,70), trade:lastDraft.trade, amount:Math.round(p.price), cost:Math.round(p.cost), note:note, draft:{ parts:p.lines, hours:p.hours, ai:true } });
      S.toast("Saved as an estimate.","ok"); out.innerHTML=""; render(); };
  }
  renderAi();
  /* Brian can hand a job over: estimates.html?ai=<what he heard>&c=<customer>&t=<trade> fills the draft and starts it */
  (function(){ var u=new URLSearchParams(location.search), t=u.get("ai"); if(!t) return;
    if(u.get("c")) aiHost.querySelector("#aiCust").value=u.get("c");
    if(u.get("t")&&[].some.call(aiHost.querySelector("#aiTrade").options,function(o){ return o.value===u.get("t"); })) aiHost.querySelector("#aiTrade").value=u.get("t");
    aiHost.querySelector("#aiText").value=t; aiHost.scrollIntoView({block:"start"}); aiHost.querySelector("#aiGo").click(); })();

  function render(){
    host.innerHTML="";
    var es=S.modeEstimates();
    host.appendChild(S.card('<div class="stats">'+
      S.stat("Open value",S.money(S.estimateValue()),"Requested, scheduled and quoted","good")+
      S.stat("Win rate",S.winRate()==null?"—":S.pct(S.winRate()),"Of everything decided")+
      S.stat("Won",es.filter(function(e){return e.stage==="Won";}).length,"This book")+
      S.stat("Lost",es.filter(function(e){return e.stage==="Lost";}).length,"Worth a follow-up")+'</div>'+
      '<div class="pipe">'+S.ESTIMATE_STAGES.map(function(st){
        return '<div class="pipe-col"><div class="pipe-n">'+es.filter(function(e){return e.stage===st;}).length+
          '</div><div class="pipe-l">'+S.esc(st)+'</div></div>'; }).join("")+'</div>'));
    es.forEach(function(e){
      var c=S.customerById(e.customerId), m=e.amount?((e.amount-e.cost)/e.amount)*100:0;
      host.appendChild(S.card('<div class="cardhead"><h2>'+S.esc(e.title)+'</h2>'+
        '<span class="tag"><span class="dotc" style="background:'+S.tradeColor(e.trade)+'"></span>'+S.esc(e.trade)+'</span>'+
        (e.stage==="Lost"?S.tag("lost","bad"):e.amount?S.tag(S.money(e.amount)+" · "+S.pct(m)+" margin",m>=40?"good":"watch"):S.tag("not priced yet",""))+'</div>'+
        '<p class="sub">'+S.esc(c?c.name:"")+' · '+S.esc(c?c.city:"")+' · requested '+S.esc(e.requested)+'</p>'+
        '<p>'+S.esc(e.note)+'</p>'+
        (e.amount?'<table class="kv"><tbody><tr><th>Quoted</th><td class="mono">'+S.money(e.amount)+'</td></tr>'+
          '<tr><th>Our cost</th><td class="mono">'+S.money(e.cost)+'</td></tr>'+
          '<tr class="tot"><th>Margin</th><td class="mono"><b>'+S.money(e.amount-e.cost)+'</b> · '+S.pct(m,1)+'</td></tr></tbody></table>':'')+
        (function(){
          if(!S.financeEligible(e.amount)) return '';
          var best=S.bestMonthly(e.amount);
          return '<div class="note" style="margin-top:12px;border-color:var(--teal);background:var(--teal-wash);">'+
            '<b>'+S.money(e.amount)+' — or about '+S.money(Math.round(best.monthly))+' a month.</b> '+
            '<span class="muted small">'+best.months+' months at '+best.apr+'% APR.</span>'+
            '<div class="tablewrap" style="margin-top:8px;"><table><thead><tr><th>Term</th><th class="right">APR</th>'+
            '<th class="right">Monthly</th><th class="right"></th></tr></thead><tbody>'+
            S.financeOffers(e.amount).map(function(o){
              var on = e.finance && e.finance.months===o.months;
              return '<tr><td class="mono">'+o.months+' mo</td><td class="right mono">'+o.apr+'%</td>'+
                '<td class="right mono">'+S.money(o.monthly)+'</td>'+
                '<td class="right">'+(on?S.tag("on this quote","good")
                  :'<button class="btn sm ghost" data-fin="'+e.id+'|'+o.months+'">Put on the quote</button>')+'</td></tr>';
            }).join("")+'</tbody></table></div>'+
            '<div class="muted small" style="margin-top:8px;">The margin above does not move — the customer chooses how to pay, not what it costs you. '+
            'Financing partner and underwriting are wired to your account at purchase; nothing on this floor approves anybody for credit.</div>'+
          '</div>';
        })()+
        (S.isMember(e.customerId)?'<div class="note good" style="margin-top:10px;">'+
          '<b>'+S.esc((S.customerById(e.customerId)||{}).name)+' is on '+S.esc((S.planById((S.membershipFor(e.customerId)||{}).planId)||{}).name)+'.</b> '+
          'Member pricing of '+S.memberDiscount(e.customerId)+'% applies to repair work on this account.</div>':'')+
        '<div class="rowbtns"><label class="fld inline"><span>Stage</span><select data-s="'+e.id+'">'+
        S.ESTIMATE_STAGES.map(function(st){return '<option'+(st===e.stage?" selected":"")+'>'+S.esc(st)+'</option>';}).join("")+
        '</select></label><a class="btn ghost" href="sign.html">Send for approval</a></div>'));
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-fin]"),function(b){
      b.addEventListener("click",function(){
        var p=b.getAttribute("data-fin").split("|");
        var mo=S.requestFinancing(p[0], parseInt(p[1],10));
        S.toast(mo?("Payment view added — about "+S.money(Math.round(mo))+" a month."):"Not eligible for a payment view.", mo?"ok":"bad");
        render(); }); });
    Array.prototype.forEach.call(host.querySelectorAll("[data-s]"),function(sel){
      sel.addEventListener("change",function(){ S.moveEstimate(sel.getAttribute("data-s"),sel.value);
        S.toast("Moved to "+sel.value+".","ok"); render(); }); });
  }
  render();
  document.getElementById("add").addEventListener("click",function(){
    var cs=S.db().customers;
    var p=prompt("Which customer?\n\n"+cs.map(function(c,i){return (i+1)+". "+c.name;}).join("\n")); if(!p) return;
    var c=cs[parseInt(p,10)-1]||cs.filter(function(x){return x.name.toLowerCase().indexOf(String(p).toLowerCase())>=0;})[0];
    if(!c) return S.toast("No customer matched.","bad");
    S.addEstimate({customerId:c.id,title:prompt("What is it for?")||"Estimate",
      trade:prompt("Trade",S.modeTrades()[0])||S.modeTrades()[0],
      amount:parseFloat(prompt("Quoted amount (0 if not priced)","0")||"0"),
      cost:parseFloat(prompt("Your cost","0")||"0"), note:prompt("Notes")||""});
    S.toast("Logged.","ok"); render();
  });
})();
</script>
</body>
</html>
