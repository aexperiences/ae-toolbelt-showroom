<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Approval Desk · Toolbelt OS</title>
<meta name="description" content="Anything that changes a rate, sends to a customer, writes off a callback or commits money waits here.">
<link rel="canonical" href="https://www.aexperiences.com/apps/toolbelt/approvals.html">
<meta property="og:title" content="Approval Desk · Toolbelt OS">
<meta property="og:description" content="Anything that changes a rate, sends to a customer, writes off a callback or commits money waits here.">
<meta property="og:image" content="https://www.aexperiences.com/Toolbelt_OS.png">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<link rel="apple-touch-icon" href="https://www.aexperiences.com/Toolbelt_OS.png">
<meta name="theme-color" content="#e4832b">
<link rel="stylesheet" href="toolbelt.css">
</head>
<body>
<script src="toolbelt.js"></script>
<script src="manual.js"></script>
<script>
(function(){
  var S = window.Toolbelt;
  var content = S.mount({ active:"approvals.html", crumb:"Approval Desk" });
  content.appendChild(S.page("Approval Desk",
    "It should stay nearly empty. If it fills up, the fences are set too tight.",""));
  var host=document.createElement("div"); content.appendChild(host);
  function render(){
    host.innerHTML="";
    var open=S.approvals().filter(function(a){return a.stage==="Awaiting Anthony";});
    var done=S.approvals().filter(function(a){return a.stage!=="Awaiting Anthony";});
    host.appendChild(S.card('<div class="stats">'+
      S.stat("Waiting on you",open.length,open.length?"Each one is a real fence":"Nothing waiting",open.length?"watch":"good")+
      S.stat("Cleared",done.length,"Decided this session")+
      S.stat("Revenue-affecting",open.filter(function(a){return (a.tags||[]).indexOf("revenue")>=0;}).length,"Route straight to the owner")+
      S.stat("Ready to send",open.filter(function(a){return (a.tags||[]).indexOf("send")>=0;}).length,"Nothing leaves without a decision")+'</div>'));
    open.concat(done).forEach(function(a){
      var settled=a.stage!=="Awaiting Anthony";
      host.appendChild(S.card('<div class="cardhead"><h2>'+S.esc(a.title)+'</h2><span class="tag">'+S.esc(a.dept)+'</span>'+
        (a.tags||[]).map(function(t){return S.tag(t,t==="revenue"?"watch":"");}).join("")+
        (settled?S.tag(a.stage,a.stage==="Approved"?"good":""):"")+'</div>'+
        '<table class="kv"><tbody><tr><th>Why it is being asked</th><td>'+S.esc(a.why)+'</td></tr>'+
        '<tr><th>What happens if you say yes</th><td>'+S.esc(a.impact)+'</td></tr>'+
        '<tr><th>Confidence</th><td class="mono">'+a.conf+'/100 '+S.bar(a.conf,a.conf>=80?"var(--good)":"var(--watch)")+'</td></tr></tbody></table>'+
        (settled?'':'<div class="rowbtns"><button class="btn" data-y="'+a.id+'">Approve</button>'+
          '<button class="btn ghost" data-n="'+a.id+'">Send it back</button></div>')));
    });
    host.appendChild(S.card('<h2>What always reaches this desk</h2><ul class="ticks">'+
      '<li>Any change to the labor rate, trip fee or parts markup</li>'+
      '<li>Anything that sends to a customer, a GC or a referral source</li>'+
      '<li>Writing off a callback</li><li>An offer above the pay band</li>'+
      '<li>Firing a customer or terminating a tech</li><li>Anything that commits money</li></ul>'+
      '<div class="note">Everything else the departments clear themselves. Fewer cards here over time is the scoreboard.</div>'));
    Array.prototype.forEach.call(host.querySelectorAll("[data-y]"),function(b){
      b.addEventListener("click",function(){ S.decideApproval(b.getAttribute("data-y"),"approve"); S.toast("Approved.","ok"); render(); }); });
    Array.prototype.forEach.call(host.querySelectorAll("[data-n]"),function(b){
      b.addEventListener("click",function(){ S.decideApproval(b.getAttribute("data-n"),"return"); S.toast("Sent back.","ok"); render(); }); });
  }
  render();
})();
</script>
</body>
</html>
